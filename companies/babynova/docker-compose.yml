# BabyNova. Same image as every company; only ./bundles and .env differ.
name: babynova

services:
  backend:
    build:
      context: ../..
    image: agent-backend:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8010"
    ports:
      - "${HOST_PORT:-8012}:8010"
    volumes:
      - ./bundles:/app/bundles
      # Code shared by the company's business units (imported as `shared.tools...`).
      - ./shared:/app/shared
    restart: unless-stopped
