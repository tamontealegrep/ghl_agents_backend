# Blank company deployment. Copy this folder to companies/<company>/ and see README.md
# ("Crear una empresa nueva"). The image is identical for every company; only the
# mounted ./bundles folder and the .env file differ.
name: company_template   # unique per company: the compose project name

services:
  backend:
    build:
      context: ../..           # backend/ (Dockerfile lives there)
      args:
        COMPANY: _template
    image: agents-company-template:latest
    env_file: .env             # copy env.example to .env
    environment:
      # Fixed inside the container. They override .env on purpose: the container must
      # listen on all interfaces, whatever a developer left in a local .env.
      HOST: 0.0.0.0
      PORT: "8010"
      # Company id: webhooks are served at /agents/<COMPANY>/<path>.
      COMPANY: my_company
    ports:
      # Host port: change it per company so several containers can run side by side.
      # Published on localhost only; use 0.0.0.0 (or a reverse proxy) to expose it, with the tokens set.
      - "127.0.0.1:${HOST_PORT:-8010}:8010"
    volumes:
      # Agents (graph.json, assets.json, knowledge.md, agent.yaml) and tool plugins (_tools/).
      - ./bundles:/app/bundles
      # Code shared by the company's business units (imported as `shared.tools...`).
      - ./shared:/app/shared
    restart: unless-stopped
