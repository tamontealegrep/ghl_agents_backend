# Family Aims. Same image as every company; only ./bundles and .env differ.
name: family_aims

services:
  backend:
    build:
      context: ../..
    image: agent-backend:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8010"
    ports:
      - "${HOST_PORT:-8011}:8010"
    volumes:
      - ./bundles:/app/bundles
    restart: unless-stopped
