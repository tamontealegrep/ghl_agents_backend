# Family Aims. Same image as every company; only ./bundles and .env differ.
name: family_aims

services:
  backend:
    build:
      context: ../..
      args:
        COMPANY: family_aims
    image: agents-family-aims:latest
    # Local development only: optional, never copied into the image. On Render the variables already
    # exist in the environment and no .env is needed.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8010"
      # Company id: webhooks are served at /agents/<COMPANY>/<path>.
      COMPANY: family_aims
    ports:
      - "127.0.0.1:${HOST_PORT:-8011}:8010"
    volumes:
      - ./bundles:/app/bundles
      # Code shared by the company's business units (imported as `shared.tools...`).
      - ./shared:/app/shared
    restart: unless-stopped
