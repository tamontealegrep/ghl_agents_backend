code: es
name: Spanish
native_name: español
aliases: [esp, spa, espanol, castellano]
default_enabled: true

calendar:
  weekdays: [lunes, martes, miércoles, jueves, viernes, sábado, domingo]
  months: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
  month_abbreviations: [ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
  parts_of_day: [madrugada, mañana, tarde, noche]
  range_word: a
  clock: 12
  formats:
    date: "{day} de {month} de {year}"
    day_label: "{weekday} {day} de {month}"
    weekday_date: "{weekday} {date}"
    full_date: "{weekday}, {date}"
    day_title: "{weekday}. {day} {month_abbr}"

messages:
  closing: "Gracias por contactarte con nosotros. Si tienes alguna otra pregunta, no dudes en escribirnos. ¡Que tengas un buen día!"
  unsupported_media: "No pude entender ese mensaje. Por ahora solo puedo responderte por texto."
  menu_offer: "Puedo atenderte en {languages}."
  menu_or: o

router:
  explicit_phrases:
    - hablame en español
    - habla en español
    - habla español
    - en español por favor
    - cambiar a español
    - cambia a español
    - escribe en español
    - prefiero español
    - responde en español
  inability_phrases:
    - no hablo ingles
    - no entiendo ingles
    - no hablo este idioma
    - no entiendo este idioma
  content_words:
    - hola
    - gracias
    - por favor
    - español
    - subrogacion
    - subrrogacion
    - gestacion
    - maternidad
    - fertilizacion
    - interesa
    - quiero
    - metodo
    - ropa
    - embarazo
    - pareja
    - nombre
    - correo
    - viajar
  topic_words:
    - subrogacion
    - subrrogacion
    - fiv
    - ropa
    - in vitro
    - gestacion
    - maternidad
    - pareja
    - mi nombre
    - me interesa
