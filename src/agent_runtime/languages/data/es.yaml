    si no claro ok vale dale listo bueno bien correcto exacto afirmativo negativo por supuesto favor gracias
    de acuerdo obvio seguro porfa tambien perfecto genial adelante efectivamente asi

scheduling:
  today: [hoy]
  tomorrow: [mañana]
  day_after_tomorrow: [pasado mañana]
  part_words:
    early_morning: [madrugada]
    morning: [la mañana]      # a bare "mañana" is tomorrow, not the morning
    afternoon: [tarde, tardes]
    night: [noche, noches]
  ordinals:
    last: [más tarde, último, última, últimos, últimas]
    second_to_last: [penúltimo, penúltima, penúltimos, penúltimas]
    first: [primer, primero, primera, primeros, primeras, más temprano, 1ra, 1ro, 1era, 1ero]
    second: [segundo, segunda, segundos, segundas, 2da, 2do]
    third: [tercer, tercero, tercera, terceros, terceras, 3ra, 3ro, 3era, 3ero]
    fourth: [cuarto, cuarta, cuartos, cuartas, 4ta, 4to]
    fifth: [quinto, quinta, quintos, quintas, 5ta, 5to]
