[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-backend"
version = "0.1.0"
description = "One backend that serves every compiled agent. Agents are mounted as bundles (flow + settings + tool plugin) without changing the image."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0.1,<7.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "httpx>=0.27,<1.0",
    "requests>=2.31",
    "tzdata",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "openai==3.13.0",
    "anthropic>=0.40,<1",
    "google-genai>=1.0,<2",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
# scripts/agent_chat_tui.py (terminal chat with an agent, real OpenAI calls)
tui = ["questionary>=2.0", "rich>=13"]

[project.scripts]
agent-backend = "agent_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_backend = ["defaults/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "D"]
# The formatter wraps code at line-length; what is left (long strings, comments, SQL) is not worth wrapping by hand.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "RUF012", "E402", "RUF043", "B017"]  # fakes with class attributes, sys.path set-up, loose raises
"scripts/**" = ["D"]  # development tools, not library code
"**/schemas/**" = ["D1"]
"src/agent_backend/scheduling_schemas.py" = ["D1"]  # pydantic models: the field descriptions are the documentation
"companies/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", ".", "companies/family_aims/bundles/_tools", "companies/babynova/bundles/_tools"]
